<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Alunos</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <h1>Cadastro de Alunos</h1>

  <!-- novalidate: quem confere os campos é o nosso JavaScript, não o navegador -->
  <form id="form-aluno" novalidate>
    <label>
      Nome
      <input name="nome" placeholder="Ex.: Ana Souza">
    </label>
    <label>
      Nota
      <input name="nota" type="number" min="0" max="10" step="0.1">
    </label>
    <button type="submit">Cadastrar</button>
  </form>
  <p id="aviso" class="aviso"></p>
  <p class="dica">Dica: clique duas vezes num aluno para tirá-lo da turma.</p>
  <label class="busca">
    Buscar aluno
    <input id="busca" type="search" placeholder="Digite um nome">
  </label>

  <p id="vazio" class="vazio" hidden>Nenhum aluno cadastrado.</p>

  <table id="quadro">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Média</th>
        <th>Situação</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
